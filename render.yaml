services:
  - type: web
    name: smartpip-trader
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DERIV_ACCOUNT_ID
        value: 1294207
      - key: DERIV_API_TOKEN
        sync: false
      - key: DERIV_APP_ID
        value: 33TlwQH6PgwEeXDG0J3QN
      - key: BASE_TRADE_AMOUNT
        value: 1
      - key: MAX_DAILY_TRADES
        value: 30
      - key: TRADE_DURATION
        value: 2
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production