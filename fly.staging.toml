# SmartPip Trader - Fly.io Staging Configuration
# https://fly.io/docs/reference/configuration/

app = "smartpip-trader-staging"
primary_region = "nai"
kill_signal = "SIGINT"
kill_timeout = "5s"
swap_size_mb = 512

[build]
  dockerfile = "deploy/Dockerfile"

[deploy]
  release_command = "python -m alemic upgrade head || true"

[env]
  PORT = "8080"
  ENVIRONMENT = "staging"
  LOG_LEVEL = "debug"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  auto_throttle = true

[metrics]
  port = 9090
  path = "/metrics"
