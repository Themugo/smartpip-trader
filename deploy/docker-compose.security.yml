version: '3.8'

services:
  smartpip-trader:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: smartpip-trader:latest
    container_name: smartpip-trader
    restart: unless-stopped
    
    # Security: Non-root user
    user: "1000:1000"
    
    # Security: Read-only filesystem
    read_only: true
    tmpfs:
      - /tmp
      - /app/data
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Security: seccomp profile
    security_opt:
      - seccomp:deploy/docker-security-profile.json
      - no-new-privileges:true
    
    # Security: Drop capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: Network isolation
    networks:
      - trading-network
    
    # Security: Environment
    env_file:
      - deploy/.env.production
    
    # Security: Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    ports:
      - "8000:8000"
    
    volumes:
      # Only necessary directories mounted
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    
    # Security: No privileged mode
    privileged: false
    
    # Security: Don't share PID namespace
    pid: "private"
    
    # Security: Don't share IPC namespace
    ipc: "private"

networks:
  trading-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
